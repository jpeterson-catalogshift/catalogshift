<svg width="320" height="80" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg">
  <style>
    .catalog { fill:#444444; font-family: Arial, Helvetica, sans-serif; font-weight:500; }
    .shift { fill:#2F6FDB; font-family: Arial, Helvetica, sans-serif; font-weight:600; }
  </style>

  <!-- Text -->
  <text x="0" y="50" font-size="42">
    <tspan class="catalog">Catalog</tspan>
    <tspan class="shift">Shift</tspan>

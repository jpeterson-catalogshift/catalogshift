  <!-- Speed lines icon -->
  <rect x="245" y="20" width="50" height="6" fill="#2F6FDB"></rect>
  <rect x="255" y="30" width="40" height="6" fill="#2F6FDB"></rect>
  <rect x="265" y="40" width="30" height="6" fill="#2F6FDB"></rect>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest of Echoes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  button { text-decoration: none; -webkit-appearance: none; }
  html { min-height: 100%; background: #04080a; }
  body {
    font-family: 'Share Tech Mono', monospace;
    color: #c4ba8a;
    background: #04080a;
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .rpg {
    width: 100%; max-width: 860px; height: 620px;
    background: #060c07; border: 1px solid #1a2e14;
    border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
  }
  .hdr {
    background: #0a1a0b; border-bottom: 1px solid #1a2a14;
    padding: 9px 16px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .ttl { font-family: 'VT323', monospace; font-size: 22px; color: #a0c848; letter-spacing: 3px; margin-left: 4px; }
  .sub { font-size: 11px; color: #243818; margin-left: auto; }
  .bdy { display: flex; flex: 1; overflow: hidden; }
  .sdb {
    width: 184px; min-width: 184px; background: #080f08;
    border-right: 1px solid #162812; padding: 12px 10px;
    display: flex; flex-direction: column; gap: 9px; overflow-y: auto;
  }
  .sdb::-webkit-scrollbar { width: 4px; }
  .sdb::-webkit-scrollbar-thumb { background: #1e3018; border-radius: 2px; }
  .slbl { font-size: 9px; color: #2a4020; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
  .sval { font-size: 13px; color: #a0c848; }
  .sbar { height: 4px; background: #162010; border-radius: 2px; margin-top: 3px; }
  .sbar-f { height: 100%; border-radius: 2px; transition: width 0.3s; }
  .sinv { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
  .inv-item { font-size: 10px; color: #7a9848; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .ubtn { font-size: 9px; font-family: 'Share Tech Mono', monospace; background: #162010; color: #7a9848; border: 1px solid #2a4020; border-radius: 2px; padding: 1px 4px; cursor: pointer; }
  .ubtn:hover { background: #2a4020; }
  .hidden { display: none !important; }
  .mbl { display: none; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .log {
    flex: 1; overflow-y: auto; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .log::-webkit-scrollbar { width: 4px; }
  .log::-webkit-scrollbar-thumb { background: #1e3018; border-radius: 2px; }
  .mg { font-size: 13px; line-height: 1.55; }
  .mg.gm  { color: #c4ba8a; }
  .mg.ev  { color: #a0c848; }
  .mg.dn  { color: #c04040; }
  .mg.sy  { color: #2e4824; font-size: 11px; }
  .mg.lcbt { color: #d09848; font-size: 12px; }
  .choices {
    border-top: 1px solid #162812; padding: 10px 14px;
    display: flex; flex-direction: column; gap: 6px;
    min-height: 130px; max-height: 200px; overflow-y: auto; flex-shrink: 0;
  }
  .choices::-webkit-scrollbar { width: 4px; }
  .choices::-webkit-scrollbar-thumb { background: #1e3018; border-radius: 2px; }
  .clbl { font-size: 10px; color: #2a4020; letter-spacing: 2px; }
  .cbtn {
    background: #0a1408; color: #c4ba8a; border: 1px solid #2a4020;
    border-radius: 4px; padding: 7px 10px; font-family: 'Share Tech Mono', monospace;
    font-size: 12px; text-align: left; cursor: pointer; line-height: 1.4;
    height: auto; display: block; overflow: visible;
  }
  .cbtn:hover:not(:disabled) { background: #162010; border-color: #4a7030; color: #c8e060; }
  .cbtn:disabled { opacity: 0.35; cursor: not-allowed; }
  .rbtn {
    background: #0a1408; color: #7a9848; border: 1px solid #2a4020;
    border-radius: 4px; padding: 7px 10px; font-family: 'Share Tech Mono', monospace;
    font-size: 12px; text-align: left; cursor: pointer; width: 100%;
  }
  .rbtn:hover { background: #162010; }
  .sel-t { font-family: 'VT323', monospace; font-size: 26px; color: #a0c848; letter-spacing: 2px; }
  .sel-s { font-size: 11px; color: #4a6830; line-height: 1.6; margin: 4px 0 8px; }
  .sel-cls { display: flex; flex-direction: column; gap: 5px; }
  .cbt-name { font-family: 'VT323', monospace; font-size: 20px; color: #c04040; letter-spacing: 1px; margin-bottom: 4px; }
  .cbt-br { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .cbt-bg { flex: 1; height: 6px; background: #162010; border-radius: 3px; overflow: hidden; }
  .cbt-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .cbt-txt { font-size: 11px; min-width: 60px; text-align: right; }
  .cbt-acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .abtn {
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    padding: 5px 10px; border-radius: 4px; cursor: pointer; border: 1px solid;
  }
  .abtn.a { background: #1a1008; color: #d09848; border-color: #4a3010; }
  .abtn.a:hover:not(:disabled) { background: #2a1a08; }
  .abtn.s { background: #080a18; color: #8088d0; border-color: #202858; }
  .abtn.s:hover:not(:disabled) { background: #101428; }
  .abtn.i { background: #0a1408; color: #7a9848; border-color: #2a4020; }
  .abtn.i:hover:not(:disabled) { background: #162010; }
  .abtn.f { background: #100808; color: #a04040; border-color: #381818; }
  .abtn.f:hover:not(:disabled) { background: #1a0c0c; }
  .abtn:disabled { opacity: 0.35; cursor: not-allowed; }
  .end-v { font-family: 'VT323', monospace; font-size: 22px; color: #a0c848; letter-spacing: 2px; }
  .end-d { font-family: 'VT323', monospace; font-size: 22px; color: #c04040; letter-spacing: 2px; }
  .end-stats { font-size: 11px; color: #4a6830; margin: 4px 0 8px; }
  @media (max-width: 600px) {
    .rpg { height: 100svh; border-radius: 0; }
    .sdb { display: none; }
    .mbl { display: flex; flex-direction: column; border-bottom: 1px solid #162812; padding: 6px 10px; background: #080f08; flex-shrink: 0; }
    .mbl-bar { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #7a9848; cursor: pointer; }
    .m-arrow { font-size: 10px; margin-left: auto; transition: transform 0.2s; }
    .m-arrow.open { transform: rotate(180deg); }
    #stats-expanded { display: none; padding: 6px 0 2px; }
    #stats-expanded.open { display: block; }
    .m-row { display: flex; gap: 10px; flex-wrap: wrap; font-size: 10px; color: #7a9848; margin-bottom: 4px; }
    .m-inv-wrap { font-size: 10px; color: #7a9848; }
  }
</style>
</head>
<body>
<div class="rpg">
  <div class="hdr">
    <div class="dot" style="background:#a0c848"></div>
    <div class="dot" style="background:#3a5828"></div>
    <div class="dot" style="background:#1e3010"></div>
    <div class="ttl">FOREST OF ECHOES</div>
    <div class="sub">echoes // level 3</div>
  </div>
  <div class="bdy">
    <div class="sdb">
      <div><div class="slbl">Class</div><div class="sval" id="s-class">—</div></div>
      <div><div class="slbl">Level</div><div class="sval" id="s-level">1</div></div>
      <div>
        <div class="slbl">HP</div><div class="sval" id="s-hp">0/0</div>
        <div class="sbar"><div class="sbar-f" id="hp-bar" style="width:100%;background:#b03030"></div></div>
      </div>
      <div id="mp-row" class="hidden">
        <div class="slbl">MP</div><div class="sval" id="s-mp">0/0</div>
        <div class="sbar"><div class="sbar-f" id="mp-bar" style="width:100%;background:#4848b0"></div></div>
      </div>
      <div><div class="slbl">XP</div><div class="sval" id="s-xp">0</div></div>
      <div><div class="slbl">Gold</div><div class="sval" id="s-gold">0</div></div>
      <div><div class="slbl">ATK</div><div class="sval" id="s-atk">—</div></div>
      <div><div class="slbl">DEF</div><div class="sval" id="s-def">—</div></div>
      <div><div class="slbl">Location</div><div class="sval" id="s-loc" style="font-size:11px">—</div></div>
      <div><div class="slbl">Inventory</div><div class="sinv" id="s-inv"></div></div>
    </div>
    <div class="main">
      <div class="mbl">
        <div class="mbl-bar" onclick="toggleMobileStats()">
          <span id="m-class">—</span> · <span id="m-hp">HP 0/0</span> · <span id="m-gold">0g</span> · <span id="m-loc">—</span>
          <span class="m-arrow" id="m-arrow">▼</span>
        </div>
        <div id="stats-expanded">
          <div class="m-row">
            <span>Lv <span id="m-level">1</span></span>
            <span>XP <span id="m-xp">0</span></span>
            <span>ATK <span id="m-atk">—</span></span>
            <span>DEF <span id="m-def">—</span></span>
          </div>
          <div class="m-inv-wrap" id="m-inv"></div>
        </div>
      </div>
      <div class="log" id="log"></div>
      <div class="choices" id="choices"></div>
    </div>
  </div>
</div>
<script>
// ── DATA ──────────────────────────────────────────────────────────────────────

const CLASSES = {
  Warrior: { hp: 120, mp: 0,  atk: 18, def: 8,  desc: "High HP and defence. Straightforward and durable." },
  Mage:    { hp: 60,  mp: 80, atk: 24, def: 3,  desc: "Low HP, high ATK. Spells bypass half enemy DEF." },

const ITEMS = {

  "Crown Fragment":  { type: "key" },

const ENEMIES = {
  forest_bandit:    { name: "Forest Bandit",   hp: 45,  maxHp: 45,  atk: 13, def: 4,  xp: 35,  gold: 15 },
  bandit_captain:   { name: "Captain Greave",  hp: 100, maxHp: 100, atk: 24, def: 7,  xp: 90,  gold: 50, loot: "Captain's Map" },
  wolf_pack:        { name: "Wolf Pack",        hp: 55,  maxHp: 55,  atk: 15, def: 3,  xp: 45,  gold: 0,  loot: "Wolf Pelt" },

  shadow_beast:     { name: "Shadow Beast",     hp: 130, maxHp: 130, atk: 27, def: 8,  xp: 120, gold: 0,  loot: "Beast Fang" },
  ancient_entity:   { name: "Ancient Entity",   hp: 200, maxHp: 200, atk: 34, def: 12, xp: 280, gold: 0 },
};

// ── STORY ─────────────────────────────────────────────────────────────────────

const STORY = {

  // ── FOREST EDGE (5) ───────────────────────────────────────────────────────

  forest_edge: {
    loc: "Forest Edge",
    text: "The forest looms before you — ancient, dense, its canopy swallowing the sky. The air smells of damp earth and something older than either. Two paths enter the trees: north, a wide cart-rutted road; east, a narrow trail barely wider than your shoulders. A merchant has made camp at the treeline, his wagon listing under its load.",
    choices: [
      { label: "Speak with the merchant before entering", next: "merchant_rest" },
      { label: "Search the treeline", next: "forest_treeline" },
      { label: "Take the Bandit Road north", next: "bandit_road" },
      { label: "Follow the Old Trail east", next: "old_trail" },
    ]
  },

  forest_treeline: {
    loc: "Forest Edge",
    text: "Running your hand along the nearest trunks you find a carved arrow — deliberate, fresh, pointing north. Below it, three parallel scratches. A route marker. Someone moves through this forest regularly and wants to remember the way. The marks are too neat to be casual.",
    choices: [
      { label: "Speak with the merchant", next: "merchant_rest" },
      { label: "Take the Bandit Road north", next: "bandit_road" },
      { label: "Follow the Old Trail east", next: "old_trail" },
    ]
  },

  merchant_rest: {
    loc: "Forest Edge — Merchant Camp",
    text: "He's broad, road-worn, and relaxes only slightly when he sees you aren't bandits. \"Heading in? Brave or lost — same outcome usually.\" He's been stuck here two days. Bandits run the north road. Something wrong with the river beyond the forest. He has supplies if you have coin.",
    choices: [
      { label: "Ask what he knows about the forest", next: "merchant_intel" },
      { label: "Buy a Forest Potion (15 gold)", next: "merchant_trade", goldCost: 15 },
      { label: "Head north — Bandit Road", next: "bandit_road" },
      { label: "Head east — Old Trail", next: "old_trail" },
    ]
  },

  merchant_intel: {
    loc: "Forest Edge — Merchant Camp",
    text: "\"Captain named Greave runs the north road. Nasty, but predictable — he takes money, messages, or favours. Kills the rest.\" He lowers his voice. \"Eastern trail has an old hermit somewhere deep in it. Forest folk say he knows the old paths. If you're going all the way through, find him.\" He looks at the treeline. \"I'd go myself but I value being alive.\"",
    choices: [
      { label: "Buy a Forest Potion (15 gold)", next: "merchant_trade", goldCost: 15 },
      { label: "Head north — Bandit Road", next: "bandit_road" },
      { label: "Head east — Old Trail", next: "old_trail" },
    ]
  },

  merchant_trade: {
    loc: "Forest Edge — Merchant Camp",
    text: "He presses the bottle into your hand and takes the coin in one smooth motion. \"Whatever you hear in the deep wood — don't follow it.\" He says it like a man who already made that mistake once.",
    gives: ["Forest Potion"],
    choices: [
      { label: "Head north — Bandit Road", next: "bandit_road" },
      { label: "Head east — Old Trail", next: "old_trail" },
    ]
  },

  // ── PATH A — BANDIT ROAD (15) ─────────────────────────────────────────────

  bandit_road: {
    loc: "Bandit Road",
    text: "The road is wider than you expected — cart-rutted, well-used. Fifty yards in, movement: a bandit scout crouched in the undergrowth, watching the road. He hasn't seen you yet.",
    choices: [
      { label: "Strike before he raises the alarm", next: "bandit_scout_fight", combat: "forest_bandit" },
      { label: "Slip into the trees and sneak past", next: "bandit_scout_sneak" },
    ]
  },

  bandit_scout_fight: {
    loc: "Bandit Road",
    text: "You close the distance before he can reach his horn—",
    combat: "forest_bandit", onWin: "bandit_scout_won",
  },

  bandit_scout_won: {
    loc: "Bandit Road",
    text: "He goes down quietly. The road curves ahead toward firelight — the camp.",
    choices: [
      { label: "Approach the camp", next: "bandit_camp" },
      { label: "Check the watchtower to the east first", next: "watchtower_path" },
    ]
  },

  bandit_scout_sneak: {
    loc: "Bandit Road",
    text: "You circle through the undergrowth. The scout stares at nothing. You rejoin the road thirty yards on. The camp is visible — shelters around a central fire, a horse at a post.",
    choices: [
      { label: "Approach the camp", next: "bandit_camp" },
    ]
  },

  bandit_camp: {
    loc: "Bandit Camp",
    text: "Six or seven men. A broad figure at the centre with a captain's insignia beaten from a stolen coin-belt. He sees you before you're close enough to stop. \"Brave or stupid — haven't decided yet.\" He doesn't reach for his weapon. Not yet.",
    choices: [
      { label: "Draw your weapon", next: "bandit_captain_fight", combat: "bandit_captain" },
      { label: "Talk to him", next: "bandit_captain_confront" },
      { label: "Spot the watchtower east — investigate first", next: "watchtower_path" },
    ]
  },

  bandit_captain_confront: {
    loc: "Bandit Camp — Captain Greave",
    text: "Greave leans back. \"Three options. Thirty gold — road's yours. Fight me — maybe you win. Or carry something to my contact at the river. Sealed pouch, no questions.\" His eyes say he'll know if you open it.",
    choices: [
      { label: "Pay the toll (30 gold)", next: "bandit_bribe", goldCost: 30 },
      { label: "Accept the deal — carry the message", next: "bandit_deal" },
      { label: "Draw your weapon", next: "bandit_captain_fight", combat: "bandit_captain" },
    ]
  },

  bandit_captain_fight: {
    loc: "Bandit Camp",
    text: "Greave draws a long knife. The camp erupts.",
    combat: "bandit_captain", onWin: "bandit_captain_won",
  },

  bandit_captain_won: {
    loc: "Bandit Camp",
    text: "Greave goes down hard. The others scatter. You search the camp quickly.",
    gives: ["Captain's Map"],
    choices: [
      { label: "Search the camp further", next: "bandit_camp_after" },
      { label: "Check the watchtower east", next: "watchtower_path" },
      { label: "Continue north into the forest", next: "road_continues" },
    ]
  },

  bandit_bribe: {
    loc: "Bandit Camp",
    text: "Greave counts it twice, pockets it, waves his men back. Pure business. You notice one of the supply crates bears the same carved arrow you saw at the treeline.",
    choices: [
      { label: "Search the camp while you have safe passage", next: "bandit_camp_after" },
      { label: "Check the watchtower east", next: "watchtower_path" },
      { label: "Continue north", next: "road_continues" },
    ]
  },

  bandit_deal: {
    loc: "Bandit Camp",
    text: "Greave hands you a sealed leather pouch — small, heavy. \"River crossing. Ask for Marta. Tell her Greave sends his regards.\" He looks satisfied in a way that makes you uneasy. The road north is open.",
    gives: ["Sealed Message"],
    writesFlag: "bandit_deal_taken",
    choices: [
      { label: "Search the camp while you have passage", next: "bandit_camp_after" },
      { label: "Check the watchtower east", next: "watchtower_path" },
      { label: "Continue north", next: "road_continues" },
    ]
  },

  bandit_camp_after: {
    loc: "Bandit Camp",
    text: "Bedrolls, food stores, a locked chest. On a rough table — a note: \"Forest route confirmed viable. River shipment delayed — spirits causing problems at the ford. Use north path until further notice.\" Someone is moving serious cargo through these trees.",
    choices: [
      { label: "Check the watchtower east", next: "watchtower_path" },
      { label: "Continue north", next: "road_continues" },
    ]
  },

  watchtower_path: {
    loc: "Bandit Road — Eastern Branch",
    text: "A track branches east into older trees. Through the canopy — the top of a stone watchtower, military construction, long abandoned. The bandits haven't touched it. Something about it makes them uncomfortable.",

      { label: "Investigate the tower", next: "watchtower_climb" },
      { label: "Leave it — continue north", next: "road_continues" },
    ]
  },

  watchtower_climb: {
    loc: "Ruined Watchtower",
    text: "The stairs hold your weight but only just. The inside is dry and protected. Someone was here recently: a bedroll, a cold fire pit, and beside it — a leather-bound journal and a long torch, its head wrapped in oil-soaked cloth.",
    gives: ["Ancient Torch"],
    choices: [
      { label: "Read the journal", next: "watchtower_top" },
    ]
  },

  watchtower_top: {
    loc: "Ruined Watchtower — Top",
    text: "A scout's journal. Practical at first — patrol notes, bandit movements — then something else: \"The thing at the forest's heart is getting worse. Whatever it is, it was not always like this. The corruption comes from outside — the water changed first, then the trees near the river, then inward. Something upstream.\" Final entry: \"Do not go in without fire.\" From the top, through a gap in the canopy, you can see the river. There is smoke above it.",

      { label: "Return to the road and continue north", next: "road_continues" },
    ]
  },

  road_continues: {
    loc: "Bandit Road — Northern Stretch",
    text: "The road narrows as the trees grow older. No birds. The silence has weight. Then — a low sound from the treeline, and the unmistakable attempt of someone trying not to make noise.",
    choices: [
      { label: "Investigate carefully", next: "merchant_injured" },
      { label: "Press on", next: "deep_forest" },
    ]
  },

  // ── MERCHANT RANDOM ENCOUNTER (2) ─────────────────────────────────────────

  merchant_injured: {
    loc: "Bandit Road — Northern Stretch",
    text: "It's the merchant from the treeline. He's against a root, one hand pressed to his side, gripping a broken wheel spoke. \"Bandits. Hit me on the east road. Took everything.\" He looks between relief and embarrassment. \"I should have listened to myself.\"",

      { label: "Help him — bandage the wound", next: "merchant_help" },
      { label: "You have nothing to spare — wish him luck", next: "deep_forest" },

  merchant_help: {
    loc: "Bandit Road — Northern Stretch",
    text: "You get him patched up. It takes time. When it's done he grips your arm. \"I won't forget this. I'm heading to the river — trading post on the far bank. If you make it there, find me. I'll make it worth your while.\" He means it. You press on.",
    writesFlag: "forest_merchant_helped",
    choices: [
      { label: "Continue into the deep forest", next: "deep_forest" },
    ]
  },

  // ── PATH B — OLD TRAIL (18) ───────────────────────────────────────────────

let G = {};

function freshState(cross) {
  if (cross) {
    return {
      phase: "play",
      charClass: cross.charClass,
      hp: cross.hp, maxHp: cross.maxHp,
      mp: cross.mp, maxMp: cross.maxMp,
      gold: cross.gold, xp: cross.xp, level: cross.level,
      inventory: (cross.inventory || []).filter(n => n !== "Shadow Crown"),
      location: "Forest Edge", nodeId: "forest_edge",
      bonusAtk: 0, bonusDef: 0, combat: null, clearedCombats: [],
    };
  }
  return {
    phase: "no_save",
    charClass: null, hp:0, maxHp:0, mp:0, maxMp:0,
    gold:0, xp:0, level:1, inventory:[],
    location:"—", nodeId:"forest_edge",
    bonusAtk:0, bonusDef:0, combat:null, clearedCombats:[],
  };
}

function roll(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function calcAtk() { let b = CLASSES[G.charClass].atk; G.inventory.forEach(n => { if (ITEMS[n]?.type==="weapon") b += ITEMS[n].bonus; }); return b; }
function calcDef() { let b = CLASSES[G.charClass].def + (G.bonusDef||0); G.inventory.forEach(n => { if (ITEMS[n]?.type==="armor") b += ITEMS[n].bonus; }); return b; }

// ── WORLD FLAGS ───────────────────────────────────────────────────────────────

function getFlags() {
  try { return JSON.parse(localStorage.getItem("world_flags") || "{}"); } catch(e) { return {}; }
}
function setFlag(key, val) {
  try {
    const f = getFlags(); f[key] = val;
    localStorage.setItem("world_flags", JSON.stringify(f));
  } catch(e) {}
}

// Called from applyNode to handle flag-conditional extras per node
function processFlagExtras(nodeId) {
  const flags = getFlags();
  if (nodeId === "hermit_clearing" && flags.prisoner_freed && !G.inventory.includes("Healing Herb")) {
    G.inventory.push("Healing Herb");
    addMsg("ev", "The prisoner from the castle is sheltering here with the hermit. She recognises you immediately and presses a healing herb into your hand. \"I wondered if you'd make it this far.\"");
    setFlag("prisoner_found_forest", true);
  }
  if (nodeId === "grove_ingredient" && flags.sorcerer_spared) {
    addMsg("ev", "The Court Sorcerer described this exact plant — Moonwort, he called it. Rare beyond reckoning. He'll want to know you found it.");
    setFlag("sorcerer_ingredient_found", true);
  }
  if (nodeId === "grove_pool" && !flags.respected_pool) {
    // Reroute to the cold spirit encounter
    setTimeout(() => {
      const node = STORY["grove_pool"];
      if (node && G.nodeId === "grove_pool") {
        // Override the next choice destination
      }
    }, 0);
  }
}

// ── SAVE / LOAD ───────────────────────────────────────────────────────────────

function saveGame() {
  if (!G.charClass || G.phase === "no_save") return;
  try {
    const data = {
      phase: G.phase === "combat" ? "play" : G.phase,
      charClass: G.charClass,
      hp: G.hp, maxHp: G.maxHp, mp: G.mp, maxMp: G.maxMp,
      gold: G.gold, xp: G.xp, level: G.level,
      inventory: G.inventory, location: G.location,
      nodeId: G.phase === "combat" ? (STORY[G.nodeId]?.onWin || G.nodeId) : G.nodeId,
      clearedCombats: G.clearedCombats,
    };
    localStorage.setItem("level_3_save", JSON.stringify(data));
  } catch(e) {}
}

function loadForestSave() {
  try {
    const raw = localStorage.getItem("level_3_save");
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d.charClass || !CLASSES[d.charClass]) return false;
    Object.assign(G, d);
    G.combat = null; G.bonusAtk = 0; G.bonusDef = 0;
    G.clearedCombats = d.clearedCombats || [];
    return true;
  } catch(e) { return false; }
}

function loadCrossLevel() {
  try {
    const raw = localStorage.getItem("castle_crosslevel");
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d.charClass || !CLASSES[d.charClass]) return null;
    return d;
  } catch(e) { return null; }
}

function clearSave() {
  try { localStorage.removeItem("level_3_save"); } catch(e) {}
}

function writeForestCrossLevel() {
  try {
    const data = {
      charClass: G.charClass,
      hp: Math.max(Math.floor(G.maxHp * 0.5), G.hp),
      maxHp: G.maxHp, mp: G.mp, maxMp: G.maxMp,
      gold: G.gold, xp: G.xp, level: G.level,
      inventory: G.inventory,
    };
    localStorage.setItem("forest_crosslevel", JSON.stringify(data));
    try { localStorage.removeItem("level_4_save"); } catch(e) {}
  } catch(e) {}
}

// ── LOG ───────────────────────────────────────────────────────────────────────

function addMsg(cls, text) {
  const log = document.getElementById("log");
  const div = document.createElement("div");
  div.className = "mg " + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────

function updateSidebar() {
  document.getElementById("s-class").textContent = G.charClass || "???";
  document.getElementById("s-level").textContent = G.level;
  document.getElementById("s-xp").textContent    = G.xp;
  document.getElementById("s-hp").textContent    = G.hp + " / " + G.maxHp;
  document.getElementById("s-gold").textContent  = G.gold;
  document.getElementById("s-loc").textContent   = G.location;
  document.getElementById("s-atk").textContent   = G.charClass ? calcAtk() : "—";
  document.getElementById("s-def").textContent   = G.charClass ? calcDef() : "—";

  const hpPct = G.maxHp > 0 ? Math.round(G.hp / G.maxHp * 100) : 100;
  const hpBar = document.getElementById("hp-bar");
  hpBar.style.width = hpPct + "%";
  hpBar.style.background = hpPct > 50 ? "#b03030" : hpPct > 25 ? "#b07030" : "#dd2020";

  const mpRow = document.getElementById("mp-row");
  if (G.maxMp > 0) {
    mpRow.classList.remove("hidden");
    document.getElementById("s-mp").textContent = G.mp + " / " + G.maxMp;
    document.getElementById("mp-bar").style.width = Math.round(G.mp / G.maxMp * 100) + "%";
  } else { mpRow.classList.add("hidden"); }

  const invEl = document.getElementById("s-inv");
  invEl.innerHTML = "";
  if (G.inventory.length === 0) {
    invEl.innerHTML = '<div class="inv-item" style="color:#243818">empty</div>';
  } else {
    G.inventory.forEach(name => {
      const div = document.createElement("div");
      div.className = "inv-item";
      const span = document.createElement("span");
      span.style.paddingLeft = "4px";
      span.textContent = name;
      div.appendChild(span);
      if (ITEMS[name]?.type === "consumable") {
        const btn = document.createElement("button");
        btn.className = "ubtn";
        btn.textContent = "use";
        btn.onclick = () => useItem(name);
        div.appendChild(btn);
      }
      invEl.appendChild(div);
    });
  }

  document.getElementById("m-class").textContent = G.charClass || "???";
  document.getElementById("m-hp").textContent    = "HP " + G.hp + "/" + G.maxHp;
  document.getElementById("m-gold").textContent  = G.gold + "g";
  document.getElementById("m-loc").textContent   = G.location;
  document.getElementById("m-level").textContent = G.level;
  document.getElementById("m-xp").textContent    = G.xp;
  document.getElementById("m-atk").textContent   = G.charClass ? calcAtk() : "—";
  document.getElementById("m-def").textContent   = G.charClass ? calcDef() : "—";
  const mhpBar = document.getElementById("m-hpbar");
  if (mhpBar) { mhpBar.style.width = hpPct + "%"; mhpBar.style.background = hpPct > 50 ? "#b03030" : hpPct > 25 ? "#b07030" : "#dd2020"; }
  document.getElementById("m-inv").innerHTML = invEl.innerHTML;

  saveGame();
}

function toggleMobileStats() {
  document.getElementById("stats-expanded").classList.toggle("open");
  document.getElementById("m-arrow").classList.toggle("open");
}

// ── APPLY NODE ────────────────────────────────────────────────────────────────

function applyNode(nodeId) {
  const node = STORY[nodeId];
  if (!node) return;
  G.nodeId = nodeId;
  G.location = node.loc || G.location;
  G.bonusAtk = node.bonusAtk || 0;
  G.bonusDef = node.bonusDef || 0;

  if (node.gives) {
    node.gives.forEach(it => {
      if (!G.inventory.includes(it)) { G.inventory.push(it); addMsg("ev", "Obtained: " + it); }
    });
  }
  if (node.goldGain) { G.gold += node.goldGain; addMsg("ev", "Found " + node.goldGain + " gold!"); }
  if (node.hpCost)   { G.hp = clamp(G.hp - node.hpCost, 0, G.maxHp); addMsg("dn", "Lost " + node.hpCost + " HP!"); }
  if (node.hpGain)   { const g2 = Math.min(node.hpGain, G.maxHp - G.hp); G.hp += g2; addMsg("ev", "Recovered " + g2 + " HP."); }
  if (node.writesFlag) { setFlag(node.writesFlag, true); }

  processFlagExtras(nodeId);

  // Spirit pool routing: cold spirit if pool not respected
  if (nodeId === "grove_pool") {
    const flags = getFlags();
    if (!flags.respected_pool) {
      addMsg("gm", node.text);
      G.phase = "play";
      updateSidebar();
      // Override: go to cold spirit
      const coldNode = STORY["spirit_cold"];
      G.nodeId = "spirit_cold";
      G.location = coldNode.loc;
      addMsg("gm", coldNode.text);
      if (coldNode.ending) G.phase = "ended";
      updateSidebar();
      renderChoices();
      return;
    }
  }

  addMsg("gm", node.text);

  if (node.combat && (!node.choices || node.choices.length === 0)) {
    G.phase = "combat";
    G.combat = { enemyId: node.combat, enemy: Object.assign({}, ENEMIES[node.combat]), onWin: node.onWin, onLose: node.onLose };
  }
  if (node.ending) { G.phase = "ended"; }
  updateSidebar();
  renderChoices();
}

// ── CHOICES ───────────────────────────────────────────────────────────────────

function renderChoices() {
  const cw = document.getElementById("choices");
  cw.innerHTML = "";

  if (G.phase === "no_save") {
    const t = document.createElement("div"); t.className = "sel-t"; t.textContent = "No Save Found"; cw.appendChild(t);
    const s = document.createElement("div"); s.className = "sel-s";
    s.textContent = "Complete the Castle of Echoes first to continue here."; cw.appendChild(s);
    const btn = document.createElement("button"); btn.className = "cbtn";
    btn.textContent = "← Return to the Castle"; btn.onclick = () => { window.location.href = "../castle/index.html"; };
    cw.appendChild(btn);
    return;
  }

  if (G.phase === "play") {
    const node = STORY[G.nodeId];
    if (!node?.choices?.length) return;
    const lbl = document.createElement("div"); lbl.className = "clbl"; lbl.textContent = "What do you do?"; cw.appendChild(lbl);
    node.choices.forEach(ch => {
      const locked = ch.requires && !G.inventory.includes(ch.requires);
      const poor   = ch.goldCost && G.gold < ch.goldCost;
      const btn = document.createElement("button");
      btn.className = "cbtn"; btn.disabled = locked || poor;
      let label = ch.label;
      if (locked) label += " [need: " + ch.requires + "]";
      if (poor)   label += " [need " + ch.goldCost + " gold]";
      btn.textContent = label;
      if (!locked && !poor) btn.onclick = () => chooseOption(ch);
      cw.appendChild(btn);
    });
    return;
  }

  if (G.phase === "combat") { renderCombat(); return; }
  if (G.phase === "ended")  { renderEnding();  return; }
}

function renderCombat() {
  const cw = document.getElementById("choices");
  const { enemy } = G.combat;
  const hpPct = Math.round(enemy.hp / enemy.maxHp * 100);
  const phPct = G.maxHp > 0 ? Math.round(G.hp / G.maxHp * 100) : 100;
  const phClr = phPct > 50 ? "#b03030" : phPct > 25 ? "#b07030" : "#dd2020";
  cw.innerHTML = `
    <div class="cbt-name">⚔ ${enemy.name}</div>
    <div class="cbt-br">
      <div class="cbt-bg"><div class="cbt-fill" style="width:${hpPct}%;background:#b03030"></div></div>
      <span class="cbt-txt" style="color:#dd5555">${enemy.hp}/${enemy.maxHp}</span>
    </div>
    <div class="cbt-br">
      <div class="cbt-bg"><div class="cbt-fill" style="width:${phPct}%;background:${phClr}"></div></div>
      <span class="cbt-txt" style="color:#dd5555">${G.hp}/${G.maxHp}</span>
    </div>
    <div class="cbt-acts" id="cbt-acts"></div>`;
  const acts = document.getElementById("cbt-acts");
  const mkBtn = (cls, label, fn, disabled) => {
    const b = document.createElement("button"); b.className = "abtn " + cls;
    b.textContent = label; b.disabled = !!disabled;
    if (!disabled) b.onclick = fn; acts.appendChild(b);
  };
  mkBtn("a", "⚔ Attack", () => combatAction("attack"));
  if (G.charClass === "Mage") mkBtn("s", G.mp >= 15 ? "⚡ Spell (15 MP)" : "⚡ Spell (low MP)", () => combatAction("spell"), G.mp < 15);
  G.inventory.filter(n => ITEMS[n]?.type === "consumable").forEach(n => {
    mkBtn("i", "🧪 " + n, () => useItem(n));
  });
  mkBtn("f", "↩ Flee", () => combatAction("flee"));
}

function renderEnding() {
  const cw = document.getElementById("choices");
  const node = STORY[G.nodeId];
  const win = node?.ending === "victory";
  const title = document.createElement("div");
  title.className = win ? "end-v" : "end-d";
  title.textContent = win ? "✦ THE FOREST OF ECHOES HAS FALLEN" : "☠ YOU HAVE FALLEN";
  cw.appendChild(title);
  const stats = document.createElement("div");
  stats.className = "end-stats";
  stats.textContent = "Final: Level " + G.level + " · " + G.gold + " gold · " + G.xp + " XP";
  cw.appendChild(stats);

  if (win) {
    writeForestCrossLevel();
    const congrats = document.createElement("div");
    congrats.style.cssText = "font-size:12px;color:#4a6828;margin-top:6px;line-height:1.6;";
    congrats.textContent = "Three levels deep. The dragon, the shadow king, the ancient guardian. Not many get this far.";
    cw.appendChild(congrats);

    const riverBtn = document.createElement("button");
    riverBtn.className = "rbtn";
    riverBtn.textContent = "→ Continue to the River of Echoes";
    riverBtn.onclick = () => { window.location.href = "../river/index.html"; };
    cw.appendChild(riverBtn);
  }

  const btn = document.createElement("button");
  btn.className = "rbtn";
  btn.style.marginTop = "4px";
  btn.textContent = win ? "↩ Play Again from the Forest" : "↩ Try Again";
  btn.onclick = () => {
    clearSave();
    document.getElementById("log").innerHTML = "";
    const cross = loadCrossLevel();
    if (cross) {
      G = freshState(cross);
      updateSidebar();
      addMsg("ev", "You stand at the forest edge once more.");
      addMsg("sy", "══════════════════════════════");
      applyNode("forest_edge");
    } else {
      G = freshState(null);
      updateSidebar();
      addMsg("dn", "No castle save found. Return to Level 2 first.");
      renderChoices();
    }
  };
  cw.appendChild(btn);

  const backBtn = document.createElement("button");
  backBtn.className = "rbtn";
  backBtn.style.marginTop = "4px";
  backBtn.textContent = "← Back to the Castle";
  backBtn.onclick = () => { try { localStorage.removeItem("castle_save"); } catch(e) {} window.location.href = "../castle/index.html"; };
  cw.appendChild(backBtn);
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────

function chooseOption(ch) {
  if (ch.requires && !G.inventory.includes(ch.requires)) return;
  if (ch.goldCost && G.gold < ch.goldCost) { addMsg("dn", "Not enough gold (need " + ch.goldCost + ")."); return; }
  if (ch.goldCost) { G.gold -= ch.goldCost; addMsg("dn", "Paid " + ch.goldCost + " gold."); }

  if (ch.combat) {
    if (G.clearedCombats.includes(ch.next)) {
      addMsg("sy", "[This area is already cleared.]");
      applyNode(STORY[ch.next]?.onWin || ch.next);
      return;
    }
    const node = STORY[ch.next];
    G.nodeId = ch.next; G.location = node?.loc || G.location;
    G.bonusAtk = node?.bonusAtk || 0; G.bonusDef = node?.bonusDef || 0;
    if (node?.writesFlag) setFlag(node.writesFlag, true);
    addMsg("gm", node?.text || "You enter combat!");
    G.phase = "combat";
    G.combat = { enemyId: ch.combat, enemy: Object.assign({}, ENEMIES[ch.combat]), onWin: node?.onWin, onLose: node?.onLose };
    updateSidebar(); renderChoices(); return;
  }
  applyNode(ch.next);
}

function combatAction(action) {
  const { enemy, onWin, onLose } = G.combat;
  const pAtk = calcAtk() + (G.bonusAtk || 0);
  const pDef = calcDef();

  if (action === "attack") {
    let dmg = Math.max(1, pAtk - enemy.def + roll(-3, 5));
    const crit = G.charClass === "Rogue" && Math.random() < 0.3;
    if (crit) dmg = Math.round(dmg * 1.8);
    enemy.hp = Math.max(0, enemy.hp - dmg);
    addMsg("lcbt", "You hit " + enemy.name + " for " + dmg + (crit?" (CRIT!)":"") + " dmg. [" + enemy.hp + "/" + enemy.maxHp + " HP]");
  } else if (action === "spell") {
    if (G.mp < 15) return;
    let dmg = Math.max(1, pAtk + roll(5,15) - Math.floor(enemy.def/2));
    enemy.hp = Math.max(0, enemy.hp - dmg);
    G.mp = Math.max(0, G.mp - 15);
    addMsg("lcbt", "⚡ Spell hits " + enemy.name + " for " + dmg + " dmg! [" + enemy.hp + "/" + enemy.maxHp + " HP]");
  } else if (action === "flee") {
    if (Math.random() < 0.45) {
      addMsg("ev", "You fall back into the deep forest!");
      G.phase = "play"; G.combat = null; G.bonusAtk = 0; G.bonusDef = 0;
      updateSidebar(); applyNode("deep_forest"); return;
    } else { addMsg("dn", "You can't get away!"); }
  }

  if (enemy.hp <= 0) {
    const def = ENEMIES[G.combat.enemyId];
    addMsg("ev", enemy.name + " is defeated!");
    G.xp += def.xp; G.gold += def.gold;
    addMsg("ev", "+" + def.xp + " XP, +" + def.gold + " gold");
    if (def.loot && !G.inventory.includes(def.loot)) { G.inventory.push(def.loot); addMsg("ev", "Obtained: " + def.loot); }
    if (G.xp >= G.level * 60) { G.level++; G.maxHp += 15; G.hp = Math.min(G.hp + 15, G.maxHp); addMsg("ev", "★ LEVEL UP! Now level " + G.level + "."); }
    if (!G.clearedCombats.includes(G.nodeId)) G.clearedCombats.push(G.nodeId);
    G.phase = "play"; G.combat = null;
    updateSidebar(); applyNode(onWin); return;
  }

  const eDmg = Math.max(0, enemy.atk - pDef + roll(-2, 4));
  G.hp = Math.max(0, G.hp - eDmg);
  G.combat.enemy = enemy;
  addMsg("dn", enemy.name + " hits you for " + eDmg + " dmg! [" + G.hp + "/" + G.maxHp + " HP]");

  if (G.hp <= 0) {
    G.phase = "play"; G.combat = null;
    updateSidebar(); applyNode(onLose || "death"); return;
  }
  updateSidebar(); renderChoices();
}

function useItem(name) {
  const it = ITEMS[name];
  if (!it || it.type !== "consumable") return;
  G.inventory = G.inventory.filter(i => i !== name);
  if (it.effect === "hp") { const g2 = Math.min(it.val, G.maxHp - G.hp); G.hp += g2; addMsg("ev", "Used " + name + ": +" + g2 + " HP."); }
  if (it.effect === "mp") { const g2 = Math.min(it.val, G.maxMp - G.mp); G.mp += g2; addMsg("ev", "Used " + name + ": +" + g2 + " MP."); }
  updateSidebar();
  if (G.phase === "combat") renderChoices();
}

// ── INIT ──────────────────────────────────────────────────────────────────────

G = freshState(null);

if (loadForestSave()) {
  updateSidebar();
  const node = STORY[G.nodeId];
  addMsg("ev", "↩ Welcome back, " + G.charClass + ". The forest remembers you.");
  addMsg("sy", "══════════════════════════════");
  if (node) addMsg("gm", node.text);
  renderChoices();
} else {
  const cross = loadCrossLevel();
  if (cross) {
    G = freshState(cross);
    updateSidebar();
    addMsg("ev", "You emerge from the shadow of the castle into open air — and stop.");
    addMsg("ev", cross.charClass + " · Level " + cross.level + " · " + cross.gold + " gold carried over");
    addMsg("sy", "══════════════════════════════");
    applyNode("forest_edge");
  } else {
    updateSidebar();
    addMsg("dn", "No castle save found.");
    renderChoices();
  }
}
</script>
</body>
</html>
